# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Radius Redirect

on:
  workflow_dispatch:
  push:
    branches:
      - edge
      - v*.*
    paths:
      - "redirect/**"
      - ".github/workflows/redirect.yml"
  pull_request:
    branches:
      - edge
      - v*.*
    paths:
      - "redirect/**"
      - ".github/workflows/redirect.yml"

permissions: {}

jobs:
  deploy-website:
    name: Deploy Redirect Website
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false
          persist-credentials: false

      - name: Deploy staging site
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_REDIRECT_TOKEN }}
          action: upload
          app_location: redirect/src
          skip_api_build: true
          skip_app_build: true
          skip_deploy_on_missing_secrets: true

  close_pr_site:
    name: Close PR Staging Site
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_REDIRECT_TOKEN }}
          action: close
          app_location: redirect/src
          skip_deploy_on_missing_secrets: true
