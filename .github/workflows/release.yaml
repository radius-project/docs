# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Release docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Radius version supplied by the core release coordinator (e.g. 0.63.0)"
        required: true
        default: ""
        type: string

permissions: {}

jobs:
  release-docs:
    if: github.ref == 'refs/heads/edge'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # required by actions/create-github-app-token
    steps:
      # Generate a short-lived installation token scoped to this repository.
      # Requires RADIUS_RELEASE_BOT installed on radius-project/docs with:
      #   Contents: Read & Write
      - name: Get App Token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RADIUS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          repositories: docs

      # Resolve the bot's GitHub-formatted name and email dynamically from the app slug
      # so the release commit's DCO sign-off matches the App's bot identity.
      - name: Get bot details
        id: bot-details
        uses: raven-actions/bot-details@ee8966a9ff6e7e42cbfc4a56b4ddb60a9d1b40a6 # v1.2.0
        with:
          bot-slug-name: ${{ steps.app-token.outputs.app-slug }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: edge
          persist-credentials: false

      - name: Ensure inputs.version is valid semver
        run: |
          python .github/scripts/validate_semver.py "${INPUT_VERSION}"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Release docs
        run: |
          .github/scripts/release-docs.sh "${INPUT_VERSION}"
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_NAME: ${{ steps.bot-details.outputs.name }}
          BOT_EMAIL: ${{ steps.bot-details.outputs.email }}
