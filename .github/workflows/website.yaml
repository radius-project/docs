# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
# Keep this name: release branches cut before the Pages migration also emit it.
name: Radius Website

on:
  push:
    branches: ['v[0-9]+.[0-9]+']
  pull_request:
    branches: [edge, 'v[0-9]+.[0-9]+']

permissions: {}

jobs:
  release-checks:
    name: Check docs release scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/release-docs_test.sh
      - run: python3 -m unittest discover -s .github/scripts -p 'pages_*_test.py'
      - name: Test search indexing without credentials
        run: |
          python3 -m venv "$RUNNER_TEMP/search"
          "$RUNNER_TEMP/search/bin/python" -m pip install -r .github/scripts/requirements.txt
          "$RUNNER_TEMP/search/bin/python" .github/scripts/test_algolia.py
