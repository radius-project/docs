# Prepare the source-to-edge merge tree without importing source commit history.
# GitHub signs one App-authored commit on edge; content conflicts get a draft
# source-snapshot PR for manual resolution instead of conflict-marker blobs.
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Upmerge docs to edge

on:
  workflow_dispatch:

permissions: {}

jobs:
  upmerge:
    name: Upmerge docs to edge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # required by actions/create-github-app-token
    steps:
      # Generate a short-lived installation token scoped to this repository.
      # Requires RADIUS_RELEASE_BOT installed on radius-project/docs with:
      #   Contents: Read & Write, Pull requests: Read & Write, Workflows: Read & Write
      - name: Get App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RADIUS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          repositories: docs

      # Use the App identity for DCO, without overriding the signing action's author.
      - name: Get bot details
        id: bot-details
        uses: raven-actions/bot-details@ee8966a9ff6e7e42cbfc4a56b4ddb60a9d1b40a6 # v1.2.0
        with:
          bot-slug-name: ${{ steps.app-token.outputs.app-slug }}

      - name: Checkout edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: edge
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          # Git fetch uses this short-lived token to get the immutable source commit.
          persist-credentials: true

      - name: Upmerge docs
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=$(git rev-parse HEAD)
          git fetch --no-tags origin "${GITHUB_SHA}"

          MERGE_STATUS=0
          git merge --squash --no-commit "${GITHUB_SHA}" || MERGE_STATUS=$?
          UNMERGED=$(git ls-files --unmerged)
          if [[ "${MERGE_STATUS}" -ne 0 && ("${MERGE_STATUS}" -ne 1 || -z "${UNMERGED}") ]]; then
              echo "::error::Upmerge preparation failed (git merge exit ${MERGE_STATUS})."
              exit "${MERGE_STATUS}"
          fi

          restore_edge_files() {
              local path original tracked
              for path in docs/config.toml docs/layouts/partials/hooks/body-end.html; do
                  original=$(git ls-tree "${BASE_SHA}" -- "${path}")
                  tracked=$(git ls-files -- "${path}")
                  if [[ -n "${original}" ]]; then
                      git restore --source="${BASE_SHA}" --staged --worktree -- "${path}"
                  elif [[ -n "${tracked}" ]]; then
                      git rm --force -- "${path}"
                  fi
              done
          }
          restore_edge_files

          MERGE_CONFLICT=false
          UNMERGED=$(git ls-files --unmerged)
          if [[ -n "${UNMERGED}" ]]; then
              echo "::warning::Content conflicts detected. Preparing a draft source snapshot, not a resolved merge."
              git read-tree --reset -u "${GITHUB_SHA}"
              restore_edge_files
              MERGE_CONFLICT=true
          fi

          DIFF_STATUS=0
          git diff --cached --quiet "${BASE_SHA}" -- || DIFF_STATUS=$?
          case "${DIFF_STATUS}" in
              0)
                  HAS_CHANGES=false
                  echo "No changes to upmerge to edge."
                  ;;
              1) HAS_CHANGES=true ;;
              *)
                  echo "::error::Unable to inspect the prepared changes."
                  exit "${DIFF_STATUS}"
                  ;;
          esac
          {
              echo "base-sha=${BASE_SHA}"
              echo "conflict=${MERGE_CONFLICT}"
              echo "has-changes=${HAS_CHANGES}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create pull request
        id: pull-request
        if: steps.prepare.outputs.has-changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: edge
          branch: upmerge/${{ github.run_id }}-${{ github.run_attempt }}
          sign-commits: true
          # An explicit App DCO trailer avoids signing off as the default local committer.
          commit-message: |
            Upmerge ${{ github.ref_name }} to edge

            Signed-off-by: ${{ steps.bot-details.outputs.name }} <${{ steps.bot-details.outputs.email }}>
          title: Upmerge to edge
          draft: ${{ steps.prepare.outputs.conflict == 'true' }}
          body: |
            Upmerge to edge (kicked off by @${{ github.triggering_actor }}).

            Source: `${{ github.ref_name }}` at `${{ github.sha }}`.
            Edge snapshot: `${{ steps.prepare.outputs.base-sha }}`.

            ${{ steps.prepare.outputs.conflict == 'true' && '**Manual resolution required.** The merge had content conflicts. This draft contains the source snapshot, not a resolved merge. Reconcile it with edge, including edge-only content, before marking it ready for review.' || 'Prepared the clean merged tree, preserving changes from both branches without importing source commit history.' }}

            The edge versions of `docs/config.toml` and `docs/layouts/partials/hooks/body-end.html`, including deletions, are preserved. Normal review and branch rules still apply.

      - name: Verify signed upmerge
        if: steps.prepare.outputs.has-changes == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
          COMMITS_VERIFIED: ${{ steps.pull-request.outputs.pull-request-commits-verified }}
        run: |
          if [[ -z "${PR_NUMBER}" || "${COMMITS_VERIFIED}" != "true" ]]; then
              echo "::error::The action did not publish a pull request with verified commits."
              exit 1
          fi
