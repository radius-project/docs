# Prepare the source-to-edge merge tree without importing source commit history.
# GitHub signs one App-authored commit on edge; content conflicts get a draft
# source-snapshot PR for manual resolution instead of conflict-marker blobs.
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Upmerge docs to edge

on:
  workflow_dispatch:

permissions: {}

jobs:
  upmerge:
    name: Upmerge docs to edge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # required by actions/create-github-app-token
    steps:
      # Generate a short-lived installation token scoped to this repository.
      # Requires RADIUS_RELEASE_BOT installed on radius-project/docs with:
      #   Contents: Read & Write, Pull requests: Read & Write, Workflows: Read & Write
      - name: Get App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RADIUS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RADIUS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          repositories: docs

      # Use the App identity for DCO, without overriding the signing action's author.
      - name: Get bot details
        id: bot-details
        uses: raven-actions/bot-details@ee8966a9ff6e7e42cbfc4a56b4ddb60a9d1b40a6 # v1.2.0
        with:
          bot-slug-name: ${{ steps.app-token.outputs.app-slug }}

      # The helper may not exist on edge yet. Keep tooling outside the PR checkout.
      - name: Checkout workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-tooling
          persist-credentials: false

      - name: Checkout edge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: edge
          path: upmerge
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          # The helper fetches the exact source commit using this short-lived token.
          persist-credentials: true

      - name: Upmerge docs
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { prepareUpmerge } = await import(`${process.env.GITHUB_WORKSPACE}/workflow-tooling/.github/scripts/upmerge.mjs`);
            const result = prepareUpmerge({
              cwd: `${process.env.GITHUB_WORKSPACE}/upmerge`,
              source: process.env.GITHUB_SHA
            });
            core.setOutput("base-sha", result.base);
            core.setOutput("source-sha", result.source);
            core.setOutput("tree-sha", result.tree);
            core.setOutput("has-changes", result.hasChanges);
            core.setOutput("conflict", result.conflict);
            if (result.conflict) {
              core.warning(`Content conflicts require manual resolution: ${result.conflicts.join(", ")}. Preparing a draft source snapshot, not a resolved merge.`);
            }
            if (!result.hasChanges) {
              core.info("No changes to upmerge to edge.");
            }

      - name: Create pull request
        id: pull-request
        if: steps.prepare.outputs.has-changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: upmerge
          base: edge
          branch: upmerge/${{ github.run_id }}-${{ github.run_attempt }}
          sign-commits: true
          # An explicit App DCO trailer avoids signing off as the default local committer.
          commit-message: |
            Upmerge ${{ github.ref_name }} to edge

            Signed-off-by: ${{ steps.bot-details.outputs.name }} <${{ steps.bot-details.outputs.email }}>
          title: Upmerge to edge
          draft: ${{ steps.prepare.outputs.conflict == 'true' }}
          body: |
            Upmerge to edge (kicked off by @${{ github.triggering_actor }}).

            Source: `${{ github.ref_name }}` at `${{ steps.prepare.outputs.source-sha }}`.
            Edge snapshot: `${{ steps.prepare.outputs.base-sha }}`.

            ${{ steps.prepare.outputs.conflict == 'true' && '**Manual resolution required.** The merge had content conflicts. This draft contains the source snapshot, not a resolved merge. Reconcile it with edge, including edge-only content, before marking it ready for review.' || 'Prepared the clean merged tree, preserving changes from both branches without importing source commit history.' }}

            The edge versions of `docs/config.toml` and `docs/layouts/partials/hooks/body-end.html`, including deletions, are preserved. Normal review and branch rules still apply.

      - name: Verify signed upmerge
        if: steps.prepare.outputs.has-changes == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { verifyUpmerge } = await import(`${process.env.GITHUB_WORKSPACE}/workflow-tooling/.github/scripts/upmerge.mjs`);
            const url = await verifyUpmerge({
              github,
              ...context.repo,
              pullNumber: Number(process.env.PR_NUMBER),
              head: process.env.PR_HEAD,
              branch: process.env.PR_BRANCH,
              base: process.env.BASE_SHA,
              tree: process.env.TREE_SHA,
              conflict: process.env.MERGE_CONFLICT === "true",
              signoff: process.env.DCO_SIGNOFF
            });
            core.info(`Verified one GitHub-signed commit with the expected edge parent, tree, and DCO trailer: ${url}`);
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
          PR_HEAD: ${{ steps.pull-request.outputs.pull-request-head-sha }}
          PR_BRANCH: upmerge/${{ github.run_id }}-${{ github.run_attempt }}
          BASE_SHA: ${{ steps.prepare.outputs.base-sha }}
          TREE_SHA: ${{ steps.prepare.outputs.tree-sha }}
          MERGE_CONFLICT: ${{ steps.prepare.outputs.conflict }}
          DCO_SIGNOFF: "Signed-off-by: ${{ steps.bot-details.outputs.name }} <${{ steps.bot-details.outputs.email }}>"
