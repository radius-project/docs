# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: PR Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

jobs:
  upmerge-tests:
    name: Test upmerge preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Run upmerge regression tests
        run: node --test .github/scripts/upmerge.test.mjs

  merge-holds:
    # Reads only the event's labels; it never checks out PR code.
    uses: radius-project/.github/.github/workflows/__pr-holds.yml@main
    permissions: {}
    with:
      labels: ${{ vars.PR_STATUS_LABELS }}

  # Keeps the "Check for do-not-merge tag" context that the ruleset requires and
  # fails closed unless the shared merge-hold check passes.
  check-do-not-merge-tag:
    name: Check for do-not-merge tag
    needs: merge-holds
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful merge-hold validation
        if: needs.merge-holds.result != 'success'
        run: |
          echo "::error::This PR is on hold. Remove the pr:do-not-merge or pr:needs-author-response label before merging. See the merge-holds job."
          exit 1
