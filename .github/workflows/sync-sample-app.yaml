# 'unmatch' is part of the git flag --error-unmatch, not a typo.
# cspell:ignore unmatch
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Sync sample Bicep files

on:
  pull_request:
    branches:
      - edge
      - v*
  workflow_dispatch:

permissions: {}

env:
  DEST_DIR: docs/static/samples/demo

jobs:
  sync:
    name: Verify sample Bicep files are in sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download sample Bicep files from radius-project/samples
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ./.github/scripts/download-sample-app.sh

      - name: Verify the vendored samples are up to date
        run: |
          if ! git ls-files --error-unmatch "${DEST_DIR}" >/dev/null 2>&1; then
            echo "::notice::${DEST_DIR} is not vendored yet (untracked); skipping drift check."
            exit 0
          fi
          changes="$(git status --porcelain -- "${DEST_DIR}")"
          if [[ -n "${changes}" ]]; then
            echo "${changes}"
            echo "::error::${DEST_DIR} is out of sync with radius-project/samples. Run ./.github/scripts/download-sample-app.sh and commit the result."
            exit 1
          fi
