# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Validate Bicep Code

on:
  pull_request:
    branches:
      - edge
      - v*
  push:
    branches:
      - edge
      - v*

permissions: {}

jobs:
  build:
    name: Validate Bicep Code
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release extension tag selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_set_bicep_extension_tags.py'

      - name: Setup and verify bicep CLI
        run: |
          curl -fsSL -o bicep https://github.com/Azure/bicep/releases/download/v0.46.1/bicep-linux-x64
          chmod +x ./bicep
          ./bicep --version

      - name: Verify Bicep files
        run: python ./.github/scripts/validate_bicep.py
